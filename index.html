<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rumbo</title>
  <meta name="description" content="Qué hacer hoy y por qué. Herramienta personal, todo local. by Dito Labs.">
  <meta name="theme-color" content="#1B4D44">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Aplica el modo día/noche guardado antes de pintar, para que no parpadee.
    try {
      const t = localStorage.getItem('rumbo.tema');
      if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t;
    } catch (e) {}
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="saltar" href="#principal">Saltar al contenido</a>
  <div class="app">
    <aside class="lateral">
      <a class="marca" href="#/hoy" aria-label="Rumbo, ir a Mi día">
        <svg class="marca-icono" aria-hidden="true" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M16 6.5 L20 16 L16 25.5 L12 16 Z" fill="currentColor"/></svg>
        <span class="marca-texto"><span class="marca-nombre">rumbo</span><span class="marca-sub">Proyectos</span></span>
      </a>
      <p class="ceja lateral-titulo">Tu espacio</p>
      <nav class="nav" aria-label="Secciones">
        <a href="#/hoy" data-ruta="hoy"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="7" rx="1.5"/><rect x="14" y="4" width="6" height="4" rx="1.5"/><rect x="14" y="12" width="6" height="8" rx="1.5"/><rect x="4" y="15" width="6" height="5" rx="1.5"/></svg><span>Mi día</span></a>
        <a href="#/proyectos" data-ruta="proyectos"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H9l2 2h6.5A2.5 2.5 0 0 1 20 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/></svg><span>Proyectos</span></a>
        <a href="#/dia" data-ruta="dia"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 4v4h4"/></svg><span>Historial</span></a>
        <a href="#/ajustes" data-ruta="ajustes"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg><span>Ajustes</span></a>
      </nav>
      <p class="sello">Rumbo v0.7 · by Dito Labs</p>
    </aside>
    <div class="contenido">
      <header class="barra-superior">
        <a class="marca marca-movil" href="#/hoy" aria-label="Rumbo, ir a Mi día">
          <svg class="marca-icono" aria-hidden="true" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M16 6.5 L20 16 L16 25.5 L12 16 Z" fill="currentColor"/></svg>
          <span class="marca-nombre">rumbo</span>
        </a>
        <p class="miga" id="miga">Mi espacio</p>
        <p class="fecha-top"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span id="fecha-top"></span></p>
        <button type="button" class="tema-boton" id="tema-boton" data-accion="tema" aria-label="Cambiar a modo noche" title="Cambiar a modo noche">
          <svg class="icono-luna" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
          <svg class="icono-sol" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
          <span class="tema-texto">Noche</span>
        </button>
        <p class="guardado">Guardado en este equipo</p>
      </header>
      <main id="principal" tabindex="-1"><p class="cargando">Cargando…</p></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialogo" aria-labelledby="dialogo-titulo"></dialog>
  <noscript>Rumbo necesita JavaScript activado.</noscript>
</body>
</html>
